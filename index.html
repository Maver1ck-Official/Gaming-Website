<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Front screen: Google homepage ===== -->
  <div id="front" class="screen">
    <header class="topbar">
      <nav class="topbar-left">
        <a href="#">About</a>
        <a href="#">Store</a>
      </nav>
      <nav class="topbar-right">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <button class="icon-btn" aria-label="Google apps" type="button">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
            <circle cx="5" cy="5" r="1.8" /><circle cx="12" cy="5" r="1.8" /><circle cx="19" cy="5" r="1.8" />
            <circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" />
            <circle cx="5" cy="19" r="1.8" /><circle cx="12" cy="19" r="1.8" /><circle cx="19" cy="19" r="1.8" />
          </svg>
        </button>
        <button class="avatar-btn" aria-label="Google Account" type="button">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
            <circle cx="16" cy="16" r="16" fill="#4285F4" />
            <circle cx="16" cy="12.5" r="5" fill="#fff" />
            <path d="M16 19c-4.5 0-8 2.5-8 6v7h16v-7c0-3.5-3.5-6-8-6z" fill="#fff" />
          </svg>
        </button>
      </nav>
    </header>

    <main class="home">
      <button id="logo-btn" class="logo-btn" aria-label="Google" type="button">
        <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#EA4335" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" />
          <path fill="#FBBC05" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" />
          <path fill="#4285F4" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" />
          <path fill="#34A853" d="M225 3v65h-9.5V3h9.5z" />
          <path fill="#EA4335" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" />
          <path fill="#4285F4" d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z" />
        </svg>
      </button>

      <div class="searchbar" role="search">
        <button class="icon-btn plus-btn" aria-label="Add" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#5f6368"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg>
        </button>
        <input class="search-input" type="text" aria-label="Search" autocomplete="off" />
        <button class="icon-btn mic-btn" aria-label="Search by voice" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="#4285F4" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z" />
            <path fill="#34A853" d="M17 12a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 12h-2z" />
          </svg>
        </button>
        <button class="icon-btn lens-btn" aria-label="Search by image" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#4285F4" aria-hidden="true">
            <path d="M9.4 3.5 8 5H5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3h-3L14.6 3.5A2 2 0 0 0 13 3h-2a2 2 0 0 0-1.6.5zM12 17a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" />
          </svg>
        </button>
        <button class="ai-btn" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="#4285F4" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5 13.9 11.4 12 17l-1.9-5.6L4.5 9.5l5.6-1.9z" /></svg>
          <span>AI Mode</span>
        </button>
      </div>

      <div class="home-buttons">
        <button class="btn" type="button">Google Search</button>
        <button class="btn" type="button">I'm Feeling Lucky</button>
      </div>
    </main>

    <footer class="footer">
      <nav class="footer-left">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </nav>
      <div class="footer-center">Build, create, and do more with AI tools from Google</div>
      <nav class="footer-right">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </nav>
    </footer>
  </div>

  <!-- ===== Hidden game website ===== -->
  <div id="games" class="screen hidden">
    <header class="games-header">
      <button id="back-btn" class="back-btn" aria-label="Back" type="button">&#8592;</button>
      <h1 class="games-title">Game Zone</h1>
      <p class="games-subtitle">Pick a game and start playing</p>
    </header>
    <div id="games-grid" class="games-grid"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
